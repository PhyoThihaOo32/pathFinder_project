name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite file to run"
        required: true
        default: testng.xml
        type: choice
        options:
          - testng.xml
          - testng-regression.xml

jobs:
  ui-tests:
    name: UI tests (${{ github.event.inputs.suite || 'testng.xml' }})
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # ubuntu-latest ships with Chrome preinstalled; Selenium Manager resolves the
      # matching driver at run time, so there is no driver setup step here.
      - name: Report Chrome version
        run: google-chrome --version

      # Chrome runs headed on a virtual display rather than with --headless=new. That headless
      # mode intermittently fails to deliver the mouse and keyboard events WebDriver
      # synthesizes, so clicks and typing silently do nothing.
      - name: Run tests
        run: >
          xvfb-run -a
          mvn -B test
          -DsuiteXmlFile=${{ github.event.inputs.suite || 'testng.xml' }}
          -Dheadless=false

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          if-no-files-found: warn

      - name: Upload surefire output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
