# Default configuration. Every key here can be overridden at run time with a system
# property, e.g. mvn test -Dbrowser=firefox -Dheadless=true -DbaseUrl=https://staging.example.com

# Application under test
baseUrl=https://www.saucedemo.com
practiceUrl=https://the-internet.herokuapp.com

# Browser: chrome | firefox | edge
browser=chrome
headless=false

# Waits, in seconds. No implicit wait is used anywhere in this framework —
# mixing implicit and explicit waits produces unpredictable timeouts.
explicitWaitSeconds=15
pageLoadTimeoutSeconds=30

# Test data for the demo application
standardUser=standard_user
lockedOutUser=locked_out_user
password=secret_sauce
